<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LED Countdown Display – Select Station</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Share Tech Mono', monospace;
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #00ff41;
      position: relative;
      overflow-y: auto;
    }

    /* Dot matrix background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, rgba(0,255,65,0.025) 1px, transparent 1px);
      background-size: 4px 4px;
      pointer-events: none;
      z-index: 0;
    }

    .home-link {
      position: fixed;
      top: 20px;
      left: 20px;
      color: #00cc33;
      text-decoration: none;
      font-size: 1em;
      padding: 10px 20px;
      background: rgba(0,255,65,0.05);
      border: 1px solid rgba(0,255,65,0.15);
      border-radius: 6px;
      transition: all 0.3s ease;
      z-index: 100;
    }
    .home-link:hover {
      background: rgba(0,255,65,0.12);
      border-color: rgba(0,255,65,0.4);
      color: #00ff41;
    }

    .container {
      position: relative;
      z-index: 1;
      background: rgba(0,20,0,0.4);
      border: 1px solid rgba(0,255,65,0.12);
      border-radius: 12px;
      padding: 50px;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 0 40px rgba(0,255,65,0.05), inset 0 0 30px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 2.2em;
      text-align: center;
      font-weight: 400;
      letter-spacing: 3px;
      text-shadow: 0 0 15px rgba(0,255,65,0.5), 0 0 30px rgba(0,255,65,0.2);
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      font-size: 1em;
      margin-bottom: 35px;
      color: #338833;
      letter-spacing: 1px;
    }

    .search-box {
      position: relative;
      margin-bottom: 25px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 18px;
      font-size: 1.1em;
      font-family: 'Share Tech Mono', monospace;
      border: 1px solid rgba(0,255,65,0.25);
      border-radius: 8px;
      background: rgba(0,15,0,0.6);
      color: #00ff41;
      outline: none;
      transition: all 0.3s ease;
      letter-spacing: 1px;
    }
    .search-box input::placeholder {
      color: rgba(0,255,65,0.3);
    }
    .search-box input:focus {
      border-color: rgba(0,255,65,0.5);
      box-shadow: 0 0 12px rgba(0,255,65,0.15);
      background: rgba(0,20,0,0.7);
    }

    .stations-list {
      max-height: 420px;
      overflow-y: auto;
      background: rgba(0,10,0,0.5);
      border-radius: 8px;
      border: 1px solid rgba(0,255,65,0.08);
    }

    .station-item {
      padding: 14px 18px;
      cursor: pointer;
      border-bottom: 1px solid rgba(0,255,65,0.06);
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .station-item:hover {
      background: rgba(0,255,65,0.08);
    }
    .station-item:last-child {
      border-bottom: none;
    }

    .station-name {
      font-size: 1.05em;
      font-weight: bold;
      letter-spacing: 1px;
      text-shadow: 0 0 6px rgba(0,255,65,0.3);
    }

    .station-code {
      font-size: 0.85em;
      color: #337733;
    }

    .station-routes {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .route-bullet {
      display: inline-flex;
      height: 22px;
      width: 22px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 11px;
      font-weight: bold;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    .no-results, .loading {
      text-align: center;
      padding: 30px;
      color: #337733;
      letter-spacing: 1px;
    }

    .loading {
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0,255,65,0.03); border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: rgba(0,255,65,0.15); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0,255,65,0.3); }
  </style>
</head>
<body>
  <a href="/" class="home-link">← Home</a>
  <div class="container">
    <h1>LED DISPLAY</h1>
    <div class="subtitle">Select a station</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search for a station..." autocomplete="off" />
    </div>
    <div class="stations-list" id="stationsList">
      <div class="loading">LOADING STATIONS...</div>
    </div>
  </div>

  <script>
    let stations = [];
    const stationRoutesCache = {};

    const routeColors = {
      '1': { bg: '#EE352E', text: 'white' },
      '2': { bg: '#EE352E', text: 'white' },
      '3': { bg: '#EE352E', text: 'white' },
      '4': { bg: '#00933C', text: 'white' },
      '5': { bg: '#00933C', text: 'white' },
      '6': { bg: '#00933C', text: 'white' },
      '6X': { bg: '#00933C', text: 'white' },
      '7': { bg: '#B933AD', text: 'white' },
      '7X': { bg: '#B933AD', text: 'white' },
      'A': { bg: '#0039A6', text: 'white' },
      'C': { bg: '#0039A6', text: 'white' },
      'E': { bg: '#0039A6', text: 'white' },
      'B': { bg: '#FF6319', text: 'white' },
      'D': { bg: '#FF6319', text: 'white' },
      'F': { bg: '#FF6319', text: 'white' },
      'FX': { bg: '#FF6319', text: 'white' },
      'M': { bg: '#FF6319', text: 'white' },
      'G': { bg: '#6CBE45', text: 'white' },
      'J': { bg: '#996633', text: 'white' },
      'Z': { bg: '#996633', text: 'white' },
      'L': { bg: '#A7A9AC', text: 'white' },
      'N': { bg: '#FCCC0A', text: 'black' },
      'Q': { bg: '#FCCC0A', text: 'black' },
      'R': { bg: '#FCCC0A', text: 'black' },
      'W': { bg: '#FCCC0A', text: 'black' },
      'T': { bg: '#00ADD0', text: 'white' },
      'GS': { bg: '#808183', text: 'white' }
    };

    async function fetchStationRoutes(stationId) {
      if (stationRoutesCache[stationId]) return stationRoutesCache[stationId];
      try {
        const resp = await fetch('/api/stations/' + stationId + '/routes');
        const routes = await resp.json();
        stationRoutesCache[stationId] = routes;
        return routes;
      } catch (err) {
        return [];
      }
    }

    function createRouteBullets(routes) {
      return routes.map(route => {
        const c = routeColors[route] || { bg: '#666', text: 'white' };
        return '<span class="route-bullet" style="background-color:' + c.bg + ';color:' + c.text + ';">' + route + '</span>';
      }).join('');
    }

    async function loadStations() {
      try {
        const response = await fetch('/api/stations');
        stations = await response.json();
        displayStations(stations);
      } catch (error) {
        document.getElementById('stationsList').innerHTML =
          '<div class="no-results">ERROR LOADING STATIONS</div>';
      }
    }

    function displayStations(list) {
      const el = document.getElementById('stationsList');
      if (list.length === 0) {
        el.innerHTML = '<div class="no-results">NO STATIONS FOUND</div>';
        return;
      }
      el.innerHTML = '';
      list.forEach(station => {
        const item = document.createElement('div');
        item.className = 'station-item';
        item.innerHTML =
          '<div style="flex:1;">' +
            '<div class="station-name">' + station.name + '</div>' +
            '<div class="station-routes" id="routes-' + station.id + '">' +
              '<span style="color:#337733;font-size:11px;">Loading...</span>' +
            '</div>' +
          '</div>' +
          '<span class="station-code">' + station.id + '</span>';
        item.onclick = () => { window.location.href = '/led/station/' + station.id; };
        el.appendChild(item);

        fetchStationRoutes(station.id).then(routes => {
          const routeEl = document.getElementById('routes-' + station.id);
          if (routeEl) {
            routeEl.innerHTML = routes.length > 0
              ? createRouteBullets(routes)
              : '<span style="color:#337733;font-size:11px;">No active routes</span>';
          }
        });
      });
    }

    document.getElementById('searchInput').addEventListener('input', e => {
      const term = e.target.value.toLowerCase();
      if (!term) { displayStations(stations); return; }
      displayStations(stations.filter(s =>
        s.name.toLowerCase().includes(term) || s.id.toLowerCase().includes(term)
      ));
    });

    loadStations();
  </script>
</body>
</html>
