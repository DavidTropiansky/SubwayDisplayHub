<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citi Bike Dock Availability</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a2a3a 0%, #0d1f2d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 700px;
            width: 93%;
        }
        .home-link {
            position: fixed; top: 20px; left: 20px;
            color: rgba(255,255,255,0.8); text-decoration: none;
            font-size: 1em; padding: 10px 20px;
            background: rgba(255,255,255,0.1); border-radius: 10px;
            transition: all 0.3s;
        }
        .home-link:hover { background: rgba(255,255,255,0.2); color: #fff; }
        h1 { font-size: 2.4em; margin-bottom: 8px; text-align: center; font-weight: 700; letter-spacing: 1px; }
        .logo-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 6px; }
        .citi-blue { color: #0073cf; }
        .subtitle { text-align: center; font-size: 1.05em; margin-bottom: 30px; opacity: 0.8; font-weight: 300; }
        .search-box { position: relative; margin-bottom: 20px; }
        .search-box input {
            width: 100%; padding: 14px 18px; font-size: 1.05em;
            border: 2px solid rgba(0,115,207,0.3); border-radius: 10px;
            background: rgba(255,255,255,0.1); color: #fff; outline: none;
            transition: all 0.3s;
        }
        .search-box input::placeholder { color: rgba(255,255,255,0.5); }
        .search-box input:focus { background: rgba(255,255,255,0.18); border-color: #0073cf; }
        .stations-list {
            max-height: 440px; overflow-y: auto;
            background: rgba(0,0,0,0.25); border-radius: 10px;
        }
        .station-item {
            padding: 14px 18px; cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            transition: all 0.2s; display: flex; justify-content: space-between; align-items: center;
        }
        .station-item:hover { background: rgba(0,115,207,0.15); }
        .station-item:last-child { border-bottom: none; }
        .station-name { font-size: 1.05em; font-weight: 500; }
        .station-meta { display: flex; gap: 14px; align-items: center; }
        .bikes-badge, .docks-badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 9px; border-radius: 12px; font-size: 0.82em; font-weight: 700;
        }
        .bikes-badge { background: #0073cf; color: #fff; }
        .docks-badge { background: #444; color: #ccc; }
        .ebike-icon { color: #ffcc00; }
        .station-arrow { font-size: 1.1em; opacity: 0.4; margin-left: 10px; }
        .station-item:hover .station-arrow { opacity: 1; }
        .no-results { text-align: center; padding: 30px; opacity: 0.6; }
        .loading-text { text-align: center; padding: 30px; color: #0073cf; }
        .stats-bar {
            display: flex; justify-content: center; gap: 24px; margin-bottom: 20px;
            font-size: 0.9em; color: #aaa;
        }
        .stats-bar span { font-weight: 600; color: #0073cf; }

        .finder { background:rgba(0,115,207,.12); border:1px solid rgba(0,115,207,.35); padding:18px; border-radius:12px; margin-bottom:24px; }
        .finder h2 { font-size:1.2rem; margin-bottom:7px; }
        .finder p { color:#bac9d6; font-size:.9rem; margin-bottom:12px; line-height:1.5; }
        .finder-controls { display:flex; gap:10px; flex-wrap:wrap; }
        .finder button, .finder select { padding:11px 12px; border-radius:8px; border:1px solid #4381ae; font:inherit; }
        .finder button { background:#0073cf; color:white; cursor:pointer; font-weight:600; }
        .finder button:disabled { opacity:.55; cursor:wait; }
        .finder select { background:#17354a; color:white; flex:1; min-width:180px; max-width:100%; }
        .finder-message { margin-top:12px; color:#e0edf6; font-size:.9rem; }
        .finder-results { margin-top:14px; display:grid; gap:8px; }
        .finder-result { border:1px solid rgba(255,255,255,.12); border-radius:8px; padding:12px; background:rgba(0,0,0,.2); color:inherit; text-decoration:none; display:flex; justify-content:space-between; align-items:center; gap:12px; }
        .finder-result:hover, .finder-result:focus { background:rgba(0,115,207,.25); }
        .finder-result small { display:block; color:#a8c3d8; margin-top:5px; }
        .finder-tag { white-space:nowrap; font-size:.83rem; font-weight:700; color:#ffd95d; }
        @media (max-width:540px) { .container { padding:22px 15px; } .finder-controls > * { width:100%; } .station-meta { gap:5px; } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,115,207,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,115,207,0.5); }
    </style>
</head>
<body>
    <a href="/" class="home-link">← Home</a>
    <div class="container">
        <div class="logo-row">
            <h1>🚲 <span class="citi-blue">Citi Bike</span></h1>
        </div>
        <div class="subtitle">Dock Availability</div>
        <div class="stats-bar" id="stats-bar"></div>

        <section class="finder" aria-label="Find electric bike stations">
            <h2>⚡ Find nearby e-bikes</h2>
            <p>Use your location or choose a dock. We prioritize docks with e-bikes and <strong>zero classic bikes</strong>, then 1 classic bike, 2, and so on. Within each tier, closest comes first.</p>
            <div class="finder-controls">
                <button id="locateBtn" type="button">📍 Use my location</button>
                <select id="originStation" aria-label="Choose a starting Citi Bike dock">
                    <option value="">Or choose a starting dock…</option>
                </select>
            </div>
            <div class="finder-message" id="finderMessage" role="status" aria-live="polite">Choose a starting point to see nearby docks.</div>
            <div class="finder-results" id="finderResults"></div>
        </section>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search for a station..." autocomplete="off">
        </div>
        <div class="stations-list" id="stationsList">
            <div class="loading-text">Loading stations...</div>
        </div>
    </div>
    <script>
        let allStations = [];


        let finderOrigin = null;
        const finderMessage = document.getElementById('finderMessage');
        const finderResults = document.getElementById('finderResults');
        const originStation = document.getElementById('originStation');
        const locateBtn = document.getElementById('locateBtn');

        function distanceKm(lat1, lon1, lat2, lon2) {
            const rad = Math.PI / 180, dLat = (lat2-lat1)*rad, dLon = (lon2-lon1)*rad;
            const h = Math.sin(dLat/2)**2 + Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;
            return 6371 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1-h));
        }

        function formatDistance(km) {
            return km < 1 ? Math.round(km*1000) + ' m' : km.toFixed(2) + ' km';
        }

        function renderFinder() {
            if (!finderOrigin) return;
            // Only present working, rentable docks with at least one available e-bike.
            const candidates = allStations.filter(s =>
                s.is_installed && s.is_renting && s.ebikes > 0 &&
                Number.isFinite(s.lat) && Number.isFinite(s.lon) &&
                s.station_id !== finderOrigin.stationId
            ).map(s => ({
                ...s,
                distance: distanceKm(finderOrigin.lat, finderOrigin.lon, s.lat, s.lon)
            }));
            const closest = [...allStations].filter(s =>
                s.is_installed && s.is_renting && Number.isFinite(s.lat) && Number.isFinite(s.lon)
            ).map(s => ({...s, distance: distanceKm(finderOrigin.lat, finderOrigin.lon, s.lat, s.lon)}))
              .sort((x,y) => x.distance-y.distance)[0];
            // Search a walkable neighborhood first; expand only if nothing suitable exists.
            const radii = [1, 2, 5, Infinity];
            const radius = radii.find(r => candidates.some(s => s.distance <= r));
            const nearby = candidates.filter(s => s.distance <= radius)
                .sort((x,y) => x.classic_bikes-y.classic_bikes || x.distance-y.distance).slice(0, 8);
            finderResults.replaceChildren();
            if (!nearby.length) {
                finderMessage.textContent = 'No rentable stations with available e-bikes were found in the current feed.';
                return;
            }
            const radiusText = radius === Infinity ? 'across the network' : 'within ' + radius + ' km';
            finderMessage.textContent = finderOrigin.label +
                ' · ' + radiusText + '. Ranked by fewest classic bikes, then distance.' +
                (finderOrigin.stationId ? '' : (closest ? ' Closest dock: ' + closest.name + ' (' + formatDistance(closest.distance) + ').' : ''));
            nearby.forEach(s => {
                const link = document.createElement('a');
                link.className = 'finder-result';
                link.href = '/citibike/station/' + encodeURIComponent(s.station_id);
                const info = document.createElement('span');
                const name = document.createElement('strong');
                name.textContent = s.name;
                const extra = document.createElement('small');
                extra.textContent = formatDistance(s.distance) + ' straight-line · ⚡ ' + s.ebikes + ' e-bikes · 🚲 ' + s.classic_bikes + ' classic';
                info.append(name,extra);
                const tag = document.createElement('span');
                tag.className = 'finder-tag';
                tag.textContent = s.classic_bikes === 0 ? 'E-bike only' : s.classic_bikes + ' classic';
                link.append(info,tag);
                finderResults.appendChild(link);
            });
        }

        originStation.addEventListener('change', () => {
            const s = allStations.find(st => st.station_id === originStation.value);
            if (s) {
                finderOrigin = {lat:s.lat, lon:s.lon, label:'From ' + s.name, stationId:s.station_id};
                renderFinder();
            } else {
                finderOrigin = null;
                finderResults.replaceChildren();
                finderMessage.textContent = 'Choose a starting point to see nearby docks.';
            }
        });
        locateBtn.addEventListener('click', () => {
            if (!navigator.geolocation) {
                finderMessage.textContent = 'Location is unavailable in this browser. Select a dock instead.';
                return;
            }
            locateBtn.disabled = true;
            finderMessage.textContent = 'Requesting your location…';
            navigator.geolocation.getCurrentPosition(
                pos => {
                    locateBtn.disabled = false;
                    originStation.value = '';
                    finderOrigin = {lat:pos.coords.latitude, lon:pos.coords.longitude, label:'From your location'};
                    renderFinder();
                },
                err => {
                    locateBtn.disabled = false;
                    finderMessage.textContent = 'Location unavailable or permission denied. Please select a starting dock instead.';
                },
                {enableHighAccuracy:true, timeout:12000, maximumAge:60000}
            );
        });

        function populateFinderStationOptions() {
            const previous = originStation.value || new URLSearchParams(location.search).get('from') || '';
            originStation.replaceChildren(new Option('Or choose a starting dock…',''));
            allStations.filter(s => s.is_installed && s.is_renting)
                .forEach(s => originStation.add(new Option(s.name, s.station_id)));
            if (previous && allStations.some(s => s.station_id === previous)) {
                originStation.value = previous;
                const s = allStations.find(s => s.station_id === previous);
                if (!finderOrigin || finderOrigin.stationId) {
                    finderOrigin = {lat:s.lat, lon:s.lon, label:'From ' + s.name, stationId:s.station_id};
                }
            }
            if (finderOrigin) renderFinder();
        }

        async function loadStations() {
            try {
                const resp = await fetch('/api/citibike/stations');
                allStations = await resp.json();

                // Show stats
                const totalBikes = allStations.reduce((s, st) => s + st.num_bikes_available, 0);
                const totalEbikes = allStations.reduce((s, st) => s + st.ebikes, 0);
                const totalDocks = allStations.reduce((s, st) => s + st.num_docks_available, 0);
                document.getElementById('stats-bar').innerHTML =
                    '<span>' + allStations.length + '</span> stations &nbsp;|&nbsp; ' +
                    '<span>' + totalBikes + '</span> bikes &nbsp;|&nbsp; ' +
                    '<span>' + totalEbikes + '</span> e-bikes &nbsp;|&nbsp; ' +
                    '<span>' + totalDocks + '</span> docks';

                displayStations(allStations);
                populateFinderStationOptions();
            } catch (err) {
                document.getElementById('stationsList').innerHTML =
                    '<div class="no-results">Error loading stations. Please refresh.</div>';
            }
        }

        function displayStations(list) {
            const el = document.getElementById('stationsList');
            if (list.length === 0) {
                el.innerHTML = '<div class="no-results">No stations found</div>';
                return;
            }
            el.innerHTML = '';
            list.forEach(function(st) {
                const item = document.createElement('div');
                item.className = 'station-item';
                const bikesColor = st.num_bikes_available === 0 ? '#c0392b' : '#0073cf';
                const docksColor = st.num_docks_available === 0 ? '#c0392b' : '#444';
                item.innerHTML =
                    '<div class="station-name">' + st.name + '</div>' +
                    '<div class="station-meta">' +
                        '<span class="bikes-badge" style="background:' + bikesColor + '">🚲 ' + st.num_bikes_available +
                            (st.ebikes > 0 ? ' <span class="ebike-icon">⚡' + st.ebikes + '</span>' : '') +
                        '</span>' +
                        '<span class="docks-badge" style="background:' + docksColor + '">🅿 ' + st.num_docks_available + '</span>' +
                        '<span class="station-arrow">→</span>' +
                    '</div>';
                item.onclick = function() {
                    window.location.href = '/citibike/station/' + encodeURIComponent(st.station_id);
                };
                el.appendChild(item);
            });
        }

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            if (!term) { displayStations(allStations); return; }
            displayStations(allStations.filter(function(st) {
                return st.name.toLowerCase().includes(term);
            }));
        });

        loadStations();
        // Refresh every 60s
        setInterval(loadStations, 60000);
    </script>
</body>
</html>
