<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multi-Station Subway Display</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
.toolbar{display:flex;align-items:center;gap:12px;padding:9px 14px;background:#111;border-bottom:1px solid #444;min-height:50px}
.toolbar a,.toolbar button{color:white;background:#222;border:1px solid #555;border-radius:5px;text-decoration:none;padding:8px 12px;font-size:13px;cursor:pointer}
.toolbar strong{flex:1;text-align:center;font-size:17px}
.boards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:minmax(0,1fr);flex:1;min-height:0}
.boards.count-3,.boards.count-4{grid-template-rows:repeat(2,minmax(0,1fr))}
.boards.count-3 .board:last-child{grid-column:1 / -1}
.boards.count-1{grid-template-columns:minmax(0,1fr)}
.board{position:relative;min-width:0;display:flex;flex-direction:column}
.board{border:1px solid #444}
.boards.count-3 .board:last-child{border-top:3px solid #555}
.board iframe{width:100%;height:100%;border:0;flex:1}
.error{padding:28px;text-align:center}
@media(max-width:700px){.toolbar{flex-wrap:wrap}.toolbar strong{order:-1;flex-basis:100%}.boards{overflow:auto;grid-template-columns:repeat(2,minmax(310px,1fr));min-height:0}.boards.count-3,.boards.count-4{grid-template-rows:repeat(2,minmax(260px,1fr))}}
:fullscreen .toolbar{display:none}
</style>
</head>
<body>
<div class="toolbar">
<a href="/display">← Change stations</a>
<strong>Multi-station subway arrivals</strong>
<button id="fullscreen" type="button">Fullscreen</button>
</div>
<main id="boards" class="boards" aria-label="Side-by-side subway station arrival boards"></main>
<script>
const params=new URLSearchParams(location.search);
const ids=[1,2,3,4].map(i=>params.get('station'+i)).filter(Boolean);
const valid=ids.length>=2 && ids.length<=4 &&
 ids.every(id=>/^[A-Za-z0-9_-]{1,20}$/.test(id)) &&
 new Set(ids).size===ids.length &&
 ids.every((id,i)=>params.get('station'+(i+1))===id);
const boards=document.getElementById('boards');
if(!valid){
 boards.className='error';
 boards.textContent='Select two to four different stations to open this display.';
}else{
 boards.classList.add('count-'+ids.length);
 document.querySelector('.toolbar strong').textContent=ids.length+'-station subway arrivals';
 for(let i=0;i<ids.length;i++){
  const section=document.createElement('section');
  section.className='board';
  section.setAttribute('aria-label','Station '+(i+1)+' arrivals');
  const frame=document.createElement('iframe');
  frame.title='Station '+(i+1)+' arrivals';
  frame.src='/display/station/'+encodeURIComponent(ids[i])+'?embedded=1';
  section.appendChild(frame);
  boards.appendChild(section);
 }
}
document.getElementById('fullscreen').addEventListener('click',async()=>{
 try{
  if(document.fullscreenElement) await document.exitFullscreen();
  else await document.documentElement.requestFullscreen();
 }catch(e){console.error('Fullscreen unavailable',e);}
});
document.addEventListener('fullscreenchange',()=>{
 document.getElementById('fullscreen').textContent=document.fullscreenElement?'Exit fullscreen':'Fullscreen';
});
</script>
</body>
</html>
