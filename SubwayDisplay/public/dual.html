<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Two Station Subway Display</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
.toolbar{display:flex;align-items:center;gap:12px;padding:9px 14px;background:#111;border-bottom:1px solid #444;min-height:50px}
.toolbar a,.toolbar button{color:white;background:#222;border:1px solid #555;border-radius:5px;text-decoration:none;padding:8px 12px;font-size:13px;cursor:pointer}
.toolbar strong{flex:1;text-align:center;font-size:17px}
.boards{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);flex:1;min-height:0}
.board{position:relative;min-width:0;display:flex;flex-direction:column}
.board + .board{border-left:3px solid #555}
.board iframe{width:100%;height:100%;border:0;flex:1}
.error{padding:28px;text-align:center}
@media(max-width:700px){.toolbar{flex-wrap:wrap}.toolbar strong{order:-1;flex-basis:100%}.boards{overflow-x:auto;grid-template-columns:minmax(340px,1fr) minmax(340px,1fr)}}
:fullscreen .toolbar{display:none}
</style>
</head>
<body>
<div class="toolbar">
<a href="/display">← Change stations</a>
<strong>Two-station subway arrivals</strong>
<button id="fullscreen" type="button">Fullscreen</button>
</div>
<main id="boards" class="boards" aria-label="Side-by-side subway station arrival boards"></main>
<script>
const params=new URLSearchParams(location.search);
const ids=[params.get('station1'),params.get('station2')];
const valid=ids.every(id=>id && /^[A-Za-z0-9_-]{1,20}$/.test(id)) && ids[0]!==ids[1];
const boards=document.getElementById('boards');
if(!valid){
 boards.className='error';
 boards.textContent='Select two different stations to open this display.';
}else{
 for(let i=0;i<ids.length;i++){
  const section=document.createElement('section');
  section.className='board';
  section.setAttribute('aria-label','Station '+(i+1)+' arrivals');
  const frame=document.createElement('iframe');
  frame.title='Station '+(i+1)+' arrivals';
  frame.src='/display/station/'+encodeURIComponent(ids[i])+'?embedded=1';
  section.appendChild(frame);
  boards.appendChild(section);
 }
}
document.getElementById('fullscreen').addEventListener('click',async()=>{
 try{
  if(document.fullscreenElement) await document.exitFullscreen();
  else await document.documentElement.requestFullscreen();
 }catch(e){console.error('Fullscreen unavailable',e);}
});
document.addEventListener('fullscreenchange',()=>{
 document.getElementById('fullscreen').textContent=document.fullscreenElement?'Exit fullscreen':'Fullscreen';
});
</script>
</body>
</html>
