<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LCD Display – Select Station</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e5e7eb;
      overflow-y: auto;
    }

    .home-link {
      position: fixed;
      top: 20px;
      left: 20px;
      color: #60a5fa;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 10px 20px;
      background: rgba(96,165,250,0.08);
      border: 1px solid rgba(96,165,250,0.2);
      border-radius: 8px;
      transition: all 0.3s ease;
      z-index: 100;
    }
    .home-link:hover {
      background: rgba(96,165,250,0.15);
      border-color: rgba(96,165,250,0.4);
    }

    .container {
      background: rgba(17, 24, 39, 0.8);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 50px;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 2.4em;
      text-align: center;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #f5f5fa 0%, #c4b5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      text-align: center;
      font-size: 15px;
      margin-bottom: 30px;
      color: #6b7280;
      font-weight: 400;
    }

    .search-box {
      position: relative;
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 18px;
      font-size: 15px;
      font-family: inherit;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      color: #e5e7eb;
      outline: none;
      transition: all 0.3s ease;
    }
    .search-box input::placeholder {
      color: #4b5563;
    }
    .search-box input:focus {
      border-color: rgba(96,165,250,0.5);
      box-shadow: 0 0 0 3px rgba(96,165,250,0.1);
      background: rgba(255,255,255,0.08);
    }

    .stations-list {
      max-height: 420px;
      overflow-y: auto;
      background: rgba(0,0,0,0.2);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .station-item {
      padding: 14px 18px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .station-item:hover {
      background: rgba(96,165,250,0.08);
    }
    .station-item:last-child {
      border-bottom: none;
    }

    .station-name {
      font-size: 15px;
      font-weight: 600;
      color: #e5e7eb;
    }

    .station-code {
      font-size: 12px;
      color: #4b5563;
      font-weight: 500;
    }

    .station-routes {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .route-bullet {
      display: inline-flex;
      height: 22px;
      width: 22px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 11px;
      font-weight: bold;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    .no-results, .loading {
      text-align: center;
      padding: 30px;
      color: #4b5563;
      font-weight: 500;
    }

    .loading {
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body>
  <a href="/" class="home-link">← Home</a>
  <div class="container">
    <h1>LCD Display</h1>
    <div class="subtitle">Select a station</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search for a station..." autocomplete="off" />
    </div>
    <div class="stations-list" id="stationsList">
      <div class="loading">Loading stations...</div>
    </div>
  </div>

  <script>
    let stations = [];
    const stationRoutesCache = {};

    const routeColors = {
      '1': { bg: '#EE352E', text: 'white' }, '2': { bg: '#EE352E', text: 'white' },
      '3': { bg: '#EE352E', text: 'white' }, '4': { bg: '#00933C', text: 'white' },
      '5': { bg: '#00933C', text: 'white' }, '6': { bg: '#00933C', text: 'white' },
      '6X': { bg: '#00933C', text: 'white' }, '7': { bg: '#B933AD', text: 'white' },
      '7X': { bg: '#B933AD', text: 'white' }, 'A': { bg: '#0039A6', text: 'white' },
      'C': { bg: '#0039A6', text: 'white' }, 'E': { bg: '#0039A6', text: 'white' },
      'B': { bg: '#FF6319', text: 'white' }, 'D': { bg: '#FF6319', text: 'white' },
      'F': { bg: '#FF6319', text: 'white' }, 'FX': { bg: '#FF6319', text: 'white' },
      'M': { bg: '#FF6319', text: 'white' }, 'G': { bg: '#6CBE45', text: 'white' },
      'J': { bg: '#996633', text: 'white' }, 'Z': { bg: '#996633', text: 'white' },
      'L': { bg: '#A7A9AC', text: 'white' }, 'N': { bg: '#FCCC0A', text: 'black' },
      'Q': { bg: '#FCCC0A', text: 'black' }, 'R': { bg: '#FCCC0A', text: 'black' },
      'W': { bg: '#FCCC0A', text: 'black' }, 'T': { bg: '#00ADD0', text: 'white' },
      'GS': { bg: '#808183', text: 'white' }
    };

    async function fetchStationRoutes(stationId) {
      if (stationRoutesCache[stationId]) return stationRoutesCache[stationId];
      try {
        const resp = await fetch('/api/stations/' + stationId + '/routes');
        const routes = await resp.json();
        stationRoutesCache[stationId] = routes;
        return routes;
      } catch (err) { return []; }
    }

    function createRouteBullets(routes) {
      return routes.map(route => {
        const c = routeColors[route] || { bg: '#666', text: 'white' };
        return '<span class="route-bullet" style="background-color:' + c.bg + ';color:' + c.text + ';">' + route + '</span>';
      }).join('');
    }

    async function loadStations() {
      try {
        const response = await fetch('/api/stations');
        stations = await response.json();
        displayStations(stations);
      } catch (error) {
        document.getElementById('stationsList').innerHTML =
          '<div class="no-results">Error loading stations</div>';
      }
    }

    function displayStations(list) {
      const el = document.getElementById('stationsList');
      if (list.length === 0) {
        el.innerHTML = '<div class="no-results">No stations found</div>';
        return;
      }
      el.innerHTML = '';
      list.forEach(station => {
        const item = document.createElement('div');
        item.className = 'station-item';
        item.innerHTML =
          '<div style="flex:1;">' +
            '<div class="station-name">' + station.name + '</div>' +
            '<div class="station-routes" id="lcd-routes-' + station.id + '">' +
              '<span style="color:#4b5563;font-size:11px;">Loading...</span>' +
            '</div>' +
          '</div>' +
          '<span class="station-code">' + station.id + '</span>';
        item.onclick = () => { window.location.href = '/lcd/station/' + station.id; };
        el.appendChild(item);

        fetchStationRoutes(station.id).then(routes => {
          const routeEl = document.getElementById('lcd-routes-' + station.id);
          if (routeEl) {
            routeEl.innerHTML = routes.length > 0
              ? createRouteBullets(routes)
              : '<span style="color:#4b5563;font-size:11px;">No active routes</span>';
          }
        });
      });
    }

    document.getElementById('searchInput').addEventListener('input', e => {
      const term = e.target.value.toLowerCase();
      if (!term) { displayStations(stations); return; }
      displayStations(stations.filter(s =>
        s.name.toLowerCase().includes(term) || s.id.toLowerCase().includes(term)
      ));
    });

    loadStations();
  </script>
</body>
</html>
